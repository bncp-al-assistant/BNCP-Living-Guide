<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BNCP Smart Welfare Portal</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#f37321;
color:#fff;
padding:20px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.container{
width:95%;
max-width:1200px;
margin:20px auto;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card h2{
color:#f37321;
margin-bottom:15px;
}

.btn,
button{
display:inline-block;
margin-top:15px;
padding:10px 20px;
background:#f37321;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
text-decoration:none;
font-size:15px;
}

.chat{
margin-top:30px;
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.chat h2{
color:#f37321;
margin-bottom:15px;
}

.chat-input{
display:flex;
gap:10px;
margin-bottom:15px;
}

#userInput{
flex:1;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

#chatBox{

height:180px;

overflow-y:auto;

border:1px solid #ddd;

border-radius:8px;

padding:15px;

background:#fafafa;

}

.user{
margin-bottom:12px;
color:#0055aa;
}

.ai{
margin-bottom:15px;
color:#333;
}

footer{
margin-top:40px;
padding:20px;
text-align:center;
color:#777;
}

</style>

</head>

<body>

<header>

BNCP Smart Welfare Portal

</header>

<div class="container">

<div class="grid">

<div class="card" id="mealCard">
  <h2>🍽 오늘의 식단</h2>
  <div id="mealContent" style="margin-bottom: 10px; font-size: 14px; color: #555;">
    식단을 불러오는 중...
  </div>
  <a href="menu.pdf" class="btn" target="_blank">전체 PDF 보기</a>
</div>

<div class="card">

<h2>📢 공지사항</h2>

<p>최신 공지사항을 확인하세요.</p>

<a href="#" class="btn">바로가기</a>

</div>

<div class="card">

<h2>🏢 시설 안내</h2>

<p>시설 위치 및 이용시간 안내</p>

<a href="#" class="btn">시설 보기</a>

</div>

<div class="card">

<h2>🌤 날씨</h2>

<p id="weather">날씨 불러오는 중...</p>

</div>

<div class="card">

<h2>📅 시설 예약</h2>

<p>테니스장, 사우나 예약</p>

<button onclick="location.href='reservation.html'">

예약하기

</button>

</div>

<div class="card">

<h2>📦 자산관리</h2>

<p>QR 자산 조회</p>

<a href="#" class="btn">바로가기</a>

</div>

</div>

<div class="chat">

<h2>🤖 BNCP AI Assistant</h2>

<div class="chat-input">

<input
type="text"
id="userInput"
placeholder="질문을 입력하세요..."
onkeypress="if(event.key==='Enter'){sendMessage();}"
>

<button onclick="sendMessage()">

전송

</button>

</div>

<div id="chatBox"></div>

</div>

</div>

<footer>

© 2026 Hanwha E&C BNCP Smart Welfare Portal

</footer>

<script>

async function loadTodayMeal() {
  const mealContent = document.getElementById("mealContent");
  if (!mealContent) return;

  const days = ['일', '월', '화', '수', '목', '금', '토'];
  
  try {
    // menu.json 로드
    const response = await fetch('./menu.json');
    if (!response.ok) throw new Error('menu.json 파일을 찾을 수 없습니다.');
    
    const weeklyData = await response.json();
    
    // 현재 요일 파악 (데이터가 없으면 '목'요일 기본값 적용)
    const todayIndex = new Date().getDay();
    const todayName = days[todayIndex];
    const todayData = weeklyData[todayName] || weeklyData['목'];
    
    // 오늘 식단 렌더링
    mealContent.innerHTML = `
      <div style="font-weight: bold; color: #f37321; margin-bottom: 8px;">
        📅 오늘 (${todayName}요일, ${todayData.date})
      </div>
      <div style="background: #fafafa; padding: 10px; border-radius: 6px; line-height: 1.6;">
        <p><b>🌅 조식:</b> ${todayData.breakfast.slice(0, 3).join(', ')} 외</p>
        <p><b>☀️ 중식:</b> ${todayData.lunch.slice(0, 3).join(', ')} 외</p>
        <p><b>🌙 석식:</b> ${todayData.dinner.slice(0, 3).join(', ')} 외</p>
      </div>
    `;
  } catch (e) {
    console.error(e);
    mealContent.innerHTML = `<span style="color:#888;">식단 정보를 불러올 수 없습니다. (menu.json 확인 필요)</span>`;
  }
}

// 3. 페이지 로딩이 완료되면 식단 불러오기 자동 실행
document.addEventListener("DOMContentLoaded", loadTodayMeal);
</script>

</body>
</html>
