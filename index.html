<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BNCP Smart Welfare Portal</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#f37321;
color:#fff;
padding:20px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.container{
width:95%;
max-width:1200px;
margin:20px auto;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card h2{
color:#f37321;
margin-bottom:15px;
}

.btn,
button{
display:inline-block;
margin-top:15px;
padding:10px 20px;
background:#f37321;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
text-decoration:none;
font-size:15px;
}

.chat{
margin-top:30px;
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.chat h2{
color:#f37321;
margin-bottom:15px;
}

.chat-input{
display:flex;
gap:10px;
margin-bottom:15px;
}

#userInput{
flex:1;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

#chatBox{

height:180px;

overflow-y:auto;

border:1px solid #ddd;

border-radius:8px;

padding:15px;

background:#fafafa;

}

.user{
margin-bottom:12px;
color:#0055aa;
}

.ai{
margin-bottom:15px;
color:#333;
}

footer{
margin-top:40px;
padding:20px;
text-align:center;
color:#777;
}

</style>

</head>

<body>

<header>

BNCP Smart Welfare Portal

</header>

<div class="container">

<div class="grid">

<div class="card">

<h2>🍽 오늘의 식단</h2>

<p>이번 주 식단을 확인하세요.</p>

<a href="menu.pdf" class="btn" target="_blank">식단 보기</a>

</div>

<div class="card">

<h2>📢 공지사항</h2>

<p>최신 공지사항을 확인하세요.</p>

<a href="#" class="btn">바로가기</a>

</div>

<div class="card">

<h2>🏢 시설 안내</h2>

<p>시설 위치 및 이용시간 안내</p>

<a href="#" class="btn">시설 보기</a>

</div>

<div class="card">

<h2>🌤 날씨</h2>

<p id="weather">날씨 불러오는 중...</p>

</div>

<div class="card">

<h2>📅 시설 예약</h2>

<p>테니스장, 사우나 예약</p>

<button onclick="location.href='reservation.html'">

예약하기

</button>

</div>

<div class="card">

<h2>📦 자산관리</h2>

<p>QR 자산 조회</p>

<a href="#" class="btn">바로가기</a>

</div>

</div>

<div class="chat">

<h2>🤖 BNCP AI Assistant</h2>

<div class="chat-input">

<input
type="text"
id="userInput"
placeholder="질문을 입력하세요..."
onkeypress="if(event.key==='Enter'){sendMessage();}"
>

<button onclick="sendMessage()">

전송

</button>

</div>

<div id="chatBox"></div>

</div>

</div>

<footer>

© 2026 Hanwha E&C BNCP Smart Welfare Portal

</footer>

<script>

async function sendMessage(){

const input=document.getElementById("userInput");
const chat=document.getElementById("chatBox");

if(input.value.trim()=="") return;

const question=input.value;

chat.innerHTML+=`<div class="user"><b>🙋 나</b><br>${question}</div>`;

input.value="";

chat.scrollTop=chat.scrollHeight;

try{

const response=await fetch("https://broken-poetry-c6d2.chogak1449.workers.dev/",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

message:question

})

});

const data=await response.json();

chat.innerHTML+=`<div class="ai"><b>🤖 AI</b><br>${data.reply}</div>`;

chat.scrollTop=chat.scrollHeight;

}catch(e){

chat.innerHTML+=`<div class="ai" style="color:red"><b>오류</b><br>연결에 실패했습니다.</div>`;

}

}

</script>

</body>
</html>
