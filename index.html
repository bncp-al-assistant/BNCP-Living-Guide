<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNCP Smart Welfare Portal</title>

    <link rel="stylesheet" href="style.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f5f5f5;
        }

        header{
            background:#f37321;
            color:white;
            padding:20px;
            text-align:center;
            font-size:28px;
            font-weight:bold;
        }

        .container{
            width:95%;
            max-width:1200px;
            margin:20px auto;
        }

        .grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
        }

        .card{
            background:white;
            border-radius:12px;
            box-shadow:0 3px 10px rgba(0,0,0,.15);
            padding:20px;
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-5px);
        }

        .card h2{
            color:#f37321;
            margin-bottom:15px;
        }

        .btn{
            display:inline-block;
            margin-top:15px;
            background:#f37321;
            color:white;
            padding:10px 20px;
            border-radius:8px;
            text-decoration:none;
        }

        .chat{
            margin-top:30px;
            background:white;
            border-radius:12px;
            box-shadow:0 3px 10px rgba(0,0,0,.15);
            padding:20px;
        }

        #chatBox{
            height:350px;
            border:1px solid #ddd;
            overflow-y:auto;
            padding:10px;
            margin-bottom:10px;
        }

        #userInput{
            width:80%;
            padding:10px;
        }

        button{
            padding:10px 20px;
            background:#f37321;
            color:white;
            border:none;
            cursor:pointer;
            border-radius:5px;
        }

        footer{
            text-align:center;
            padding:20px;
            margin-top:40px;
            color:#666;
        }
    </style>
</head>

<body>

<header>
    BNCP Smart Welfare Portal
</header>

<div class="container">

    <div class="grid">

        <div class="card">
            <h2>🍽 오늘의 식단</h2>
            <p>이번 주 식단을 확인하세요.</p>
            <a href="menu.pdf" class="btn" target="_blank">식단 보기</a>
        </div>

        <div class="card">
            <h2>📢 공지사항</h2>
            <p>최신 공지사항을 확인하세요.</p>
            <a href="notices/" class="btn">바로가기</a>
        </div>

        <div class="card">
            <h2>🏢 시설 안내</h2>
            <p>시설 위치 및 이용시간 안내</p>
            <a href="facilities/" class="btn">시설 보기</a>
        </div>

        <div class="card">
            <h2>🌤 날씨</h2>
            <p id="weather">
                현재 날씨를 불러오는 중...
            </p>
        </div>

        <div class="card">
            <h2>📅 시설 예약</h2>
            <p>테니스장, 사우나 예약</p>
            <button onclick="location.href='reservation.html'">

예약하기

</button>
        </div>

        <div class="card">
            <h2>📦 자산관리</h2>
            <p>QR 자산 조회</p>
            <a href="#" class="btn">바로가기</a>
        </div>

    </div>

    <div class="chat">

        <h2>🤖 BNCP AI Assistant</h2>

        <div id="chatBox"></div>

        <input
            type="text"
            id="userInput"
            placeholder="질문을 입력하세요...">

        <button onclick="sendMessage()">
            전송
        </button>

    </div>

</div>

<footer>

© 2026 Hanwha E&C BNCP Smart Welfare Portal

</footer>

<script>

async function sendMessage(){

    const input=document.getElementById("userInput");
    const chat=document.getElementById("chatBox");

    if(input.value=="") return;

    chat.innerHTML+=`<p><b>나 :</b> ${input.value}</p>`;

    const question=input.value;

    input.value="";

    try{

        const response=await fetch("https://broken-poetry-c6d2.chogak1449.workers.dev/",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                message:question
            })

        });

        const data=await response.json();

        chat.innerHTML+=`<p><b>AI :</b> ${data.reply}</p>`;

        chat.scrollTop=chat.scrollHeight;

    }catch{

        chat.innerHTML+=`<p style="color:red">오류가 발생했습니다.</p>`;

    }

}

// 예시 날씨 표시
document.getElementById("weather").innerHTML =
"🌞 38°C / Baghdad";

</script>

</body>
</html>
