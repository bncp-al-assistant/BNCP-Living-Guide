<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>시설예약</title>

<link rel="stylesheet" href="reservation.css">

</head>

<body>

<header>

<h1>🏢 시설 예약</h1>

<a href="index.html">← 메인으로</a>

</header>

<div class="container">

<h2>예약 신청</h2>

<form id="reservationForm">

<label>이용일자</label>

<input type="date" id="date" required>

<label>팀명</label>

<select id="team">

<option>관리재경팀</option>

<option>공사팀</option>

<option>HSE팀</option>

<option>IT팀</option>

</select>

<label>신청자</label>

<input type="text" id="name">

<label>인원</label>

<input type="number" id="people">

<label>시설</label>

<select id="facility">

<option>Club House Hall</option>

<option>Lounge</option>

<option>Sauna</option>

<option>Tennis Court</option>

<option>Meeting Room</option>

</select>

<label>요청사항</label>

<textarea id="memo"></textarea>

<button type="submit">

예약하기

</button>

</form>

</div>

<div class="container">

<h2>예약현황</h2>

<table>

<thead>

<tr>

<th>날짜</th>

<th>시설</th>

<th>신청자</th>

<th>팀</th>

</tr>

</thead>

<tbody id="reservationList">

</tbody>

</table>

</div>

<script src="reservation.js"></script>

</body>

</html>
